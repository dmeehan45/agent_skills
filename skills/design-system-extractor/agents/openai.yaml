interface:
  display_name: "Public Site Design System Modernizer"
  short_description: "Measure a public website in a real browser and emit a brand-faithful design system — DTCG tokens, layered CSS, Tailwind v3/v4 themes, and measured component contracts — verified by a round-trip fidelity check against the source pixels."
  default_prompt: "Extract a brand-faithful design system from this public website. Run the measurement pipeline (discover, capture, aggregate, emit, fidelity check) rather than inferring values from markup, preserve brand character, normalize inconsistency, improve accessibility, and export the full handoff package with confidence and fidelity reporting."
